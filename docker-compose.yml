services:
  postgres:
    image: postgres:16-alpine
    container_name: acme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: acme_salary_db
    ports:
      - "5435:5432"
    volumes:
      - acme_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acme_salary_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: acme-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      NODE_ENV: production
      CLIENT_URL: http://localhost:5174
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/acme_salary_db?schema=public
      JWT_SECRET: supersecretjwtkeyforacmehrmanager2026!dev
      SEED_ADMIN_PASSWORD: "Admin#Pass2026!"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: acme-web
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - api

volumes:
  acme_postgres_data:
